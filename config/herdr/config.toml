onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "tokyo-night"

[theme.custom]
# Tokyo Night palette: picked row = blue, cursor while switching = purple
active_row_bg = "#33467c"
selection_bg = "#6b4fa8"
accent = "#7aa2f7"

[ui]
agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[keys]
focus_agent = "prefix+shift+1..9"

[ui.sidebar.spaces]
rows = [[{ token = "state_icon" }, { token = "workspace", bold = true }], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "machine", { token = "workspace", bold = true }, "tab"], [{ token = "agent", bold = true }, "terminal_title_stripped"]]
