onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "one-dark"

[theme.custom]
# One Dark: picked row = lavender-tinted slate, cursor while switching = lighter slate, accent = soft yellow
active_row_bg = "#4c5170"
selection_bg = "#4b5263"
accent = "#e5c07b"

[ui]
agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[keys]
focus_agent = "prefix+shift+1..9"

[ui.sidebar.spaces]
rows = [[{ token = "state_icon" }, { token = "workspace", bold = true, fg = "#b4befe" }], [{ token = "branch", fg = "#8b919d" }, "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", { token = "machine", fg = "#8b919d" }, { token = "workspace", bold = true, fg = "#b4befe" }, { token = "tab", fg = "#8b919d" }], [{ token = "agent", bold = true, fg = "#c678dd" }, { token = "terminal_title_stripped", fg = "#abb2bf" }]]

[ui.sidebar.agents.rows_by_agent]
# Same layout per agent; only the agent name color differs
claude = [["state_icon", { token = "machine", fg = "#8b919d" }, { token = "workspace", bold = true, fg = "#b4befe" }, { token = "tab", fg = "#8b919d" }], [{ token = "agent", bold = true, fg = "#d97757" }, { token = "terminal_title_stripped", fg = "#abb2bf" }]]
codex = [["state_icon", { token = "machine", fg = "#8b919d" }, { token = "workspace", bold = true, fg = "#b4befe" }, { token = "tab", fg = "#8b919d" }], [{ token = "agent", bold = true, fg = "#98c379" }, { token = "terminal_title_stripped", fg = "#abb2bf" }]]
agy = [["state_icon", { token = "machine", fg = "#8b919d" }, { token = "workspace", bold = true, fg = "#b4befe" }, { token = "tab", fg = "#8b919d" }], [{ token = "agent", bold = true, fg = "#4285f4" }, { token = "terminal_title_stripped", fg = "#abb2bf" }]]
